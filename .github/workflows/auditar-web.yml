name: auditar-web

# Auditoría de una web pública desde el CI (el entorno de desarrollo no llega a *.gob.ar):
# HTML, formularios, scripts, endpoints y archivos -> reports/fuentes/auditoria_web/.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: URLs semilla (separadas por espacio)
        default: >-
          https://transito.vialidad.gob.ar/SelCE_WEB/tmda.html
          https://transito.vialidad.gob.ar/SelCE_WEB/
          https://transito.vialidad.gob.ar/SelCE_WEB/index.html
          https://transito.vialidad.gob.ar/
          https://www.argentina.gob.ar/transporte/vialidad-nacional/institucional/informacion-publica/tmda
      hosts:
        description: Hosts donde seguir enlaces (coma)
        default: transito.vialidad.gob.ar
      navegador:
        description: URLs a abrir con navegador (pedidos de red, DOM, menú y consulta de prueba)
        default: >-
          https://transito.vialidad.gob.ar/SelCE_WEB/intro.html
          https://transito.vialidad.gob.ar/SelCE_WEB/tmda.html
      menu:
        description: Ítems del menú a cliquear (coma)
        default: TMDA,Temporales,Interanuales,SEGMENTACIÓN,CLASIFICACIÓN
      valor:
        description: Valor para la consulta de prueba (ruta)
        default: "0226"

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTACT: "github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e . playwright && uv run playwright install --with-deps chromium

      - name: Auditoría estática
        run: uv run python scripts/auditar_web.py ${{ inputs.urls }} --hosts "${{ inputs.hosts }}"
        continue-on-error: true

      - name: Auditoría con navegador
        run: >-
          uv run python scripts/auditar_navegador.py ${{ inputs.navegador }}
          --menu "${{ inputs.menu }}" --valor "${{ inputs.valor }}"
        continue-on-error: true

      - name: Commit del informe
        run: |
          git config user.name "potenciar-mdq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports/fuentes/auditoria_web
          git add reports/fuentes/auditoria_web
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "auditoría web: ${{ inputs.navegador }}"
          subido=false
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then subido=true; break; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          $subido || { echo "No se pudo subir el informe"; exit 1; }
