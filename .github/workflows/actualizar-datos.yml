# Actualización automática: baja los datos abiertos, reconstruye la BD y los marts, exporta los
# JSON de la web y, si cambiaron, los commitea en main. Vercel despliega solo al recibir el push.
name: actualizar-datos
on:
  schedule:
    - cron: "17 11 5,20 * *"   # días 5 y 20 de cada mes, 08:17 hora argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONTACT: "github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[pdf]"

      - name: Cache de descargas (raw)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Probe de fuentes
        run: uv run pmdq probe
        continue-on-error: true
        timeout-minutes: 20

      - name: Pipeline completo
        run: uv run pmdq all
        timeout-minutes: 60

      - name: Muestras de fuentes nuevas
        run: uv run pmdq muestras-fuentes
        continue-on-error: true

      - name: Publicar reportes y BD como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potenciar-mdq-${{ github.run_number }}
          path: |
            reports/
            data/bd/
            data/raw/manifest.jsonl
          retention-days: 90

      - name: Commit de datos y reportes si cambiaron
        run: |
          git config user.name "potenciar-mdq-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/data/*.json reports/probe.md reports/qa/*.md reports/fuentes data/municipal
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización automática $(date -u +%Y-%m-%d)"
            # Si llegó un commit a main durante la corrida (código u otra corrida de datos), rebasar
            # antes de subir. Ante conflicto en archivos generados gana esta corrida (-X theirs:
            # en un rebase "theirs" es el commit propio que se reaplica). Si no sube, falla.
            subido=false
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
                subido=true; break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            $subido || { echo "No se pudieron subir los datos"; exit 1; }
          fi
