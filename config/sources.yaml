# Registro de fuentes. `make probe` valida cada una; `make ingest` descarga las enabled.
# kind: ckan_package | ckan_search | dkan_package | html_links | static_file
# kind url_pattern: genera URLs desde una plantilla ({yyyy} / {yyyymm}) y baja las que existan.
# verified: false hasta que `make probe` confirme el endpoint (el entorno de desarrollo no llega a *.gob.ar).

defaults:
  min_interval_s: 1.0       # rate limit por host
  timeout_connect_s: 10
  timeout_read_s: 120

sources:
  anac_movimientos:
    kind: ckan_package
    base_url: https://datos.transporte.gob.ar
    dataset: aterrizajes-y-despegues-procesados-por-la-administracion-nacional-de-aviacion-civil-anac
    resource_formats: [csv]
    # Cobertura confirmada: un CSV por año desde 2019. Formato real 2023–2026 validado con el espejo.
    # fallback: mismo dataset federado en datos.gob.ar
    fallback:
      base_url: https://datos.gob.ar
      dataset: transporte-aterrizajes-despegues-procesados-por-administracion-nacional-aviacion-civil-anac
    enabled: true
    verified: false

  yvera_conectividad:
    kind: ckan_package
    base_url: https://datos.yvera.gob.ar
    dataset: conectividad-aerea
    resource_formats: [csv, pdf]
    fallback:
      base_url: https://datos.gob.ar
      dataset: turismo-conectividad-aerea
    enabled: true
    verified: false

  anac_dnta:
    kind: html_links
    url: https://consultas-publicas.anac.gob.ar/estadisticas-dnta/
    follow_pattern: /estadisticas-dnta/canal/      # sub-páginas a recorrer (1 nivel)
    file_extensions: [xlsx, xls, csv, pdf]
    enabled: true
    verified: false

  ourairports:
    kind: static_file
    url: https://raw.githubusercontent.com/davidmegginson/ourairports-data/main/airports.csv
    enabled: true
    verified: true      # local_code == código ANAC (MDP, AER, BCA...) verificado 2026-10-24

  # Lista oficial de aeródromos y helipuertos (ANAC vía Secretaría de Transporte): código local
  # (el mismo que usa el CSV de movimientos, incluidos los numéricos), OACI, IATA y coordenadas.
  # OurAirports no tiene muchos aeródromos chicos/helipuertos ni los códigos numéricos.
  anac_aeropuertos:
    kind: static_file
    url: https://datos.transporte.gob.ar/dataset/62b3fe5f-ffe6-4d8f-9d59-bfabe75d1ee8/resource/eb54e49e-9a5a-4614-91f4-526c650d0105/download/aeropuertos_detalle.csv
    preview: true        # el probe muestra las primeras líneas (formato de coordenadas)
    enabled: true
    verified: false

  # Base de aeronaves de OpenSky (matrícula -> designador ICAO, fabricante, modelo). Se usa solo
  # para validar el modelo estandarizado por matrícula (reports/qa/muestras.md). Matrículas en
  # el CSV de ANAC desde 2026. El índice se previsualiza para ver si cambió el nombre del archivo.
  opensky_aeronaves:
    kind: static_file
    url: https://opensky-network.org/datasets/metadata/aircraftDatabase.csv
    enabled: true
    verified: false
  # MADHEL (Manual de Aeródromos y Helipuertos, ANAC/AIS). Sin API documentada: el probe escanea
  # la página y sus .js para encontrar el endpoint de datos (ver reports/probe.md). Objetivo:
  # resolver los códigos numéricos del CSV de movimientos (ej. 2278, 3073, 2574).
  madhel:
    kind: static_file
    url: https://ais.anac.gob.ar/madhel/
    preview: true
    scan: true
    enabled: false        # solo probe hasta encontrar el endpoint
    verified: false
  opensky_indice:
    kind: static_file
    url: https://opensky-network.org/datasets/metadata/
    preview: true
    enabled: false        # solo probe
    verified: false

  # Clima diario en el aeropuerto (reanálisis ERA5 vía Open-Meteo, sin clave). Fin = hoy − 6 días.
  clima_mdq:
    kind: openmeteo
    url: https://archive-api.open-meteo.com/v1/archive
    latitud: -37.9342
    longitud: -57.5733
    desde: 2019-01-01
    diario: [weather_code, precipitation_sum, wind_speed_10m_max, wind_gusts_10m_max, temperature_2m_max]
    zona_horaria: America/Argentina/Buenos_Aires
    enabled: true
    verified: false

  # --- Serie 2014–2018 (agregada: los CSV por movimiento empiezan en 2019) ---
  anac_informes_mensuales:
    kind: url_pattern
    template: https://datos.anac.gob.ar/static/docs/Informe_Mensual_{yyyymm}.pdf
    desde: 2014-01
    hasta: 2018-12
    enabled: true
    verified: false     # existen 202112 y 202408; años previos a confirmar

  sna_anuales:
    kind: url_pattern
    template: https://www.argentina.gob.ar/sites/default/files/estadistica_{yyyy}.pdf
    desde: 2014-01
    hasta: 2018-12
    enabled: true
    verified: false     # existen 2014 y 2015 (pasajeros por aeropuerto)

  # Espejo de terceros (CSV originales ANAC 2023–2026, sin modificar) — solo si el portal falla.
  anac_movimientos_espejo:
    kind: static_files
    urls:
      - https://raw.githubusercontent.com/baubyte/anac-datos-2023-2026/main/2023.csv.gz
      - https://raw.githubusercontent.com/baubyte/anac-datos-2023-2026/main/2024.csv.gz
      - https://raw.githubusercontent.com/baubyte/anac-datos-2023-2026/main/2025.csv.gz
      - https://raw.githubusercontent.com/baubyte/anac-datos-2023-2026/main/2026.csv.gz
    dest_source: anac_movimientos
    enabled: false
    verified: true

  # Portal municipal (DKAN). Hallados por el probe del 2026-10-24: series propias del aeropuerto
  # y de turismo que pueden cubrir 2014–2018 y permiten cruzar vuelos con turistas.
  mdp_portal_catalogo:
    kind: dkan_package
    base_url: https://datos.mardelplata.gob.ar
    search_terms: [aeropuerto, turismo, vuelos, arribos]
    datasets:
      - movimientos-del-aeropuerto-internacional-astor-piazzolla
      - pasajeros-del-aeropuerto-astor-piazzolla
      - vuelos-del-aeropuerto-internacional-astor-piazzolla
      - vuelos-comerciales-pasajeros-por-tramo
      - vuelos-comerciales-vuelos-por-tramo
      - arribos-de-turistas
      - turismo-en-fines-de-semana-largo
      - turismo-estable-estadía-promedio
    resource_formats: [csv, xlsx, xls]
    enabled: true
    verified: true      # API DKAN responde vía /?q=api/3/action

  series_tiempo_busqueda:
    kind: static_file
    url: https://apis.datos.gob.ar/series/api/search/?q=pasajeros%20aereos&limit=50
    enabled: false      # exploratorio
    verified: false
