[project]
name = "potenciar-mdq"
version = "0.1.0"
description = "Pipeline de datos abiertos de aviación comercial en Mar del Plata"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "typer>=0.12",
  "holidays>=0.60",
  "statsmodels>=0.14",
  "networkx>=3.3",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pmdq = "potenciar_mdq.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potenciar_mdq"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# SQL embebido: las líneas largas se leen mejor que partidas.
"src/potenciar_mdq/quality.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
